<section>
    <h2>Your surveys</h2>
    <div>
        <h3>Ending soon surveys</h3>
        <div>
            @for (survey of surveys; track survey.id) {
            <app-survey-card [survey]="survey">
            </app-survey-card>
            }
            @if (surveys.length === 0) {

            <p>No surveys ending soon.</p>

            }
        </div>
    </div>
</section>
